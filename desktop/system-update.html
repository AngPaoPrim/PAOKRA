<!doctype html><html lang="th"><meta charset="utf-8"><title>PAOKRA System Update FIX</title><style>
*{box-sizing:border-box}body{margin:0;padding:26px;background:#0b1020;color:#edf3ff;font:14px Segoe UI,sans-serif}h1{margin:0 0 5px;font-size:24px}.sub,.foot{color:#9eafd1;font-size:12px}.panel{background:#121d34;border:1px solid #304365;border-radius:15px;padding:18px;margin:14px 0}select,button{font:inherit;color:#edf3ff;background:#1c2b49;border:1px solid #3d5278;border-radius:9px;padding:11px}select{width:100%;margin:8px 0}button{cursor:pointer}button:disabled{opacity:.45}.primary{background:#5669ef;border:0}.row{display:flex;gap:10px;margin-top:10px}.row button{flex:1}.notes{white-space:pre-wrap;color:#aabadd;font-size:12px;max-height:75px;overflow:auto}.step{display:flex;justify-content:space-between;margin-bottom:8px}.track{height:12px;border-radius:9px;background:#2b3852;overflow:hidden}.bar{height:100%;width:0;background:linear-gradient(90deg,#4ce0ff,#9077ff);transition:width .15s}.ind{width:35%;animation:move 1s infinite alternate}@keyframes move{to{transform:translateX(180%)}}.status{font-size:12px;color:#bac9e8;margin-top:10px;min-height:18px}.foot{line-height:1.5}
</style><body><h1>PAOKRA Studio — System Update FIX</h1><div class="sub">ตัวเสริมสำหรับเลือกเวอร์ชันและอัปเดต</div>
<section class="panel"><label>เลือกเวอร์ชันจาก GitHub Releases</label><select id="v" disabled></select><div id="notes" class="notes"></div><div class="row"><button id="refresh">รีเฟรชรายการ</button><button id="dl" class="primary" disabled>ดาวน์โหลด</button></div></section>
<section class="panel"><div class="step"><b>1 · Download</b><span id="pct">0%</span></div><div class="track"><div class="bar" id="db"></div></div><div id="ds" class="status">รอเลือกเวอร์ชัน</div></section>
<section class="panel"><div class="step"><b>2 · Install</b><span id="il">รอดาวน์โหลด</span></div><div class="track"><div class="bar" id="ib"></div></div><div id="is" class="status">ดาวน์โหลดเสร็จแล้วจึงติดตั้งได้</div><div class="row"><button id="install" class="primary" disabled>ติดตั้งเวอร์ชันที่ดาวน์โหลด</button></div></section>
<div class="foot">ดาวน์โหลดแสดงเปอร์เซ็นต์จริงจากไฟล์ที่รับมา ส่วนติดตั้งจะแสดงสถานะเปิด Windows Setup ซึ่งมีหลอดความคืบหน้าจริงของตัวเอง</div>
<script>
const {ipcRenderer}=require('electron'),$=id=>document.getElementById(id);let rs=[],file=null,busy=false;function st(id,s){$(id).textContent=s}function sel(){return rs.find(x=>x.tag===$('v').value)}function show(){let x=sel();$('notes').textContent=x?x.name+' · '+x.tag+'\n'+x.notes:'ไม่พบ Release ที่มี Setup';$('dl').disabled=!x||busy}
async function refresh(){ $('refresh').disabled=true;st('ds','กำลังโหลด GitHub Releases…');try{let x=await ipcRenderer.invoke('system-update-list');if(!x.ok)throw Error(x.error);rs=x.releases;$('v').innerHTML='';for(let r of rs){let o=document.createElement('option');o.value=r.tag;o.textContent=r.tag+' — '+r.name;$('v').append(o)}let d=rs.find(x=>x.tag==='v1.4.4-system-update-fix')||rs.find(x=>x.tag==='v1.4.4')||rs[0];if(d)$('v').value=d.tag;$('v').disabled=!rs.length;st('ds','เวอร์ชันปัจจุบัน '+x.currentVersion+' · พบ '+rs.length+' releases');show()}catch(e){st('ds','โหลดรายการไม่สำเร็จ: '+e.message)}finally{$('refresh').disabled=false}}
$('refresh').onclick=refresh;$('v').onchange=show;
$('dl').onclick=async()=>{let r=sel();if(!r)return;busy=true;file=null;$('dl').disabled=true;$('install').disabled=true;$('db').style.width='0';$('db').classList.add('ind');$('pct').textContent='0%';st('ds','กำลังดาวน์โหลด '+r.tag+'…');try{let x=await ipcRenderer.invoke('system-update-download',r.asset,r.tag,r.size,r.digest);if(!x.ok)throw Error(x.error);file=x.file;$('db').classList.remove('ind');$('db').style.width='100%';$('pct').textContent='100%';$('install').disabled=false;st('ds','ดาวน์โหลดเสร็จแล้ว: '+file)}catch(e){$('db').classList.remove('ind');st('ds','ดาวน์โหลดล้มเหลว: '+e.message)}finally{busy=false;show()}};
$('install').onclick=async()=>{if(!file)return;$('install').disabled=true;$('ib').classList.add('ind');$('il').textContent='กำลังเปิด Setup';st('is','กำลังเริ่ม Windows Setup…');let x=await ipcRenderer.invoke('system-update-install',file);if(!x.ok){$('ib').classList.remove('ind');$('install').disabled=false;st('is','เริ่มติดตั้งไม่ได้: '+x.error)}else st('is','เปิด Setup แล้ว — ทำตามหน้าต่างติดตั้ง')};
ipcRenderer.on('system-update-state',(_,x)=>{if(x.phase==='download'){if(x.percent!=null){$('db').classList.remove('ind');$('pct').textContent=x.percent+'%';$('db').style.width=x.percent+'%'}else $('db').classList.add('ind');st('ds',x.total?'ดาวน์โหลด '+(x.received/1048576).toFixed(1)+' / '+(x.total/1048576).toFixed(1)+' MB':'กำลังดาวน์โหลด…')}else if(x.phase==='downloaded'){$('db').classList.remove('ind');$('db').style.width='100%';$('pct').textContent='100%';st('ds','ดาวน์โหลดครบแล้ว — ตรวจสอบไฟล์ก่อนติดตั้ง')}});
refresh();
</script></body></html>
